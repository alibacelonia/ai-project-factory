_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml
_envops:
  variable_start_string: "[["
  variable_end_string: "]]"
  keep_trailing_newline: true
  trim_blocks: true
  lstrip_blocks: true

project_name:
  type: str
description:
  type: str
  default: A local-first full-stack SaaS application
project_slug:
  type: str
  default: "[[ project_name ]]"
package_name:
  type: str
  default: "[[ project_name | replace('-', '_') ]]"
project_type:
  type: str
  default: web-saas
template_version:
  type: str
  default: 0.2.0
authentication:
  type: bool
  default: false
database_migrations:
  type: bool
  default: false
ai_integration:
  type: bool
  default: false
background_jobs:
  type: bool
  default: false
subscriptions:
  type: bool
  default: false
email_notifications:
  type: bool
  default: false

# Frontend design questions. The factory normally supplies these values, while
# defaults keep this Copier template independently usable.
design_enabled:
  type: bool
  default: true
ui_style:
  type: str
  default: minimalism
  choices:
    - neumorphism
    - glassmorphism
    - claymorphism
    - skeuomorphism
    - flat-design
    - material-design
    - brutalism
    - neo-brutalism
    - minimalism
    - maximalism
    - bento-grid
    - aurora-ui
    - liquid-glass
    - swiss-international
    - editorial-ui
    - dark-luxe
    - cyberpunk
    - retro-y2k
    - terminal-ui
    - spatial-3d
    - organic-ui
    - kinetic-ui
ui_layout:
  type: str
  default: standard
  choices:
    - standard
    - dashboard
    - bento-grid
    - editorial
    - landing-page
    - sidebar-application
    - split-screen
    - full-screen
theme_mode:
  type: str
  default: system
  choices:
    - light
    - dark
    - system
color_palette:
  type: str
  default: style-default
  choices:
    - style-default
    - neutral
    - indigo-cyan
    - ocean
    - forest
    - sunset
    - monochrome
primary_color:
  type: str
  default: ""
accent_color:
  type: str
  default: ""
typography_preset:
  type: str
  default: style-default
  choices:
    - style-default
    - sans
    - serif
    - monospace
    - display
animation:
  type: str
  default: subtle
  choices:
    - none
    - subtle
    - kinetic
ui_effects:
  type: yaml
  default:
    - subtle-transitions

