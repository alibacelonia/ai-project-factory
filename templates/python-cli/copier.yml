_subdirectory: template
_templates_suffix: .jinja
_answers_file: .copier-answers.yml
_envops:
  variable_start_string: "[["
  variable_end_string: "]]"
  keep_trailing_newline: true
  trim_blocks: true
  lstrip_blocks: true

project_name:
  type: str
  help: Lowercase kebab-case project name
description:
  type: str
  default: A small Python command-line application
project_slug:
  type: str
  default: "[[ project_name ]]"
package_name:
  type: str
  default: "[[ project_name | replace('-', '_') ]]"
project_type:
  type: str
  default: python-cli
template_version:
  type: str
  default: 0.2.0

