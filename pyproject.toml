[build-system]
requires = ["hatchling>=1.27"]
build-backend = "hatchling.build"

[project]
name = "ai-project-factory"
version = "0.2.0"
description = "Deterministic Copier starters for Codex-assisted software projects."
readme = "README.md"
requires-python = ">=3.12"
license = { text = "MIT" }
authors = [{ name = "AI Project Factory contributors" }]
dependencies = [
  "copier>=9.10,<10",
  "pydantic>=2.10,<3",
  "PyYAML>=6,<7",
  "rich>=13.9,<15",
  "typer>=0.15,<1",
]

[project.optional-dependencies]
dev = [
  "detect-secrets>=1.5,<2",
  "pytest>=8.3,<10",
  "pytest-cov>=6,<8",
  "ruff>=0.8,<1",
]

[project.scripts]
project-factory = "project_factory.cli:app"

[tool.hatch.build.targets.wheel]
packages = ["src/project_factory"]

[tool.hatch.build.targets.wheel.force-include]
"templates" = "project_factory/templates"

[tool.pytest.ini_options]
addopts = "-ra"
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]

[tool.ruff.format]
quote-style = "double"

