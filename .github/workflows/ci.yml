name: CI

on:
  push:
  pull_request:

jobs:
  quality:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: astral-sh/setup-uv@v6
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - run: uv sync --extra dev
      - run: uv run ruff format --check .
      - run: uv run ruff check .
      - run: uv run pytest
      - name: Test design gallery contracts
        working-directory: gallery
        run: npm test
      - name: Generate SaaS smoke project
        run: >-
          uv run project-factory create --name ci-saas --type web-saas
          --ui-style glassmorphism --ui-layout dashboard --theme system
          --ui-effect glass-surfaces
          --output "$RUNNER_TEMP/ci-saas"
      - name: Install generated frontend
        working-directory: ${{ runner.temp }}/ci-saas/frontend
        run: npm install
      - name: Typecheck, test, and build generated frontend
        working-directory: ${{ runner.temp }}/ci-saas/frontend
        run: npm run typecheck && npm test && npm run build
      - name: Validate generated Docker Compose
        working-directory: ${{ runner.temp }}/ci-saas
        run: docker compose config --quiet

